name: Merge Ready Checks

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run non-restricted checks
        run: npm run check
